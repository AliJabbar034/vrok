# Release automation. Run by .github/workflows/release.yml on a version tag.
#
#   goreleaser release --clean           # publish
#   goreleaser release --snapshot --clean  # build everything locally, publish nothing
#
# `make dist` covers the same platforms without this tool; GoReleaser exists
# here for the package managers, which are the part people actually install
# through.

version: 2

project_name: vrok

before:
  hooks:
    - go mod tidy
    - go test ./...
    # Shell completions are generated by the binary itself, so they cannot
    # drift from the actual command tree. Generated on the host, since the
    # output is identical on every platform.
    - mkdir -p completions
    - sh -c 'go run -buildvcs=false ./cmd/vrok completion bash > completions/vrok.bash'
    - sh -c 'go run -buildvcs=false ./cmd/vrok completion zsh  > completions/vrok.zsh'
    - sh -c 'go run -buildvcs=false ./cmd/vrok completion fish > completions/vrok.fish'

builds:
  - id: vrok
    main: ./cmd/vrok
    binary: vrok
    # CGO off means every target cross-compiles from one Linux runner, and the
    # resulting binaries are static.
    env: [CGO_ENABLED=0]
    flags: [-trimpath, -buildvcs=false]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.date={{ .CommitDate }}
    goos: [darwin, linux, windows, freebsd]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]
    ignore:
      # Platforms nobody runs, and which would only pad the release page.
      - { goos: darwin, goarch: arm }
      - { goos: windows, goarch: arm }
      - { goos: freebsd, goarch: arm }
      - { goos: freebsd, goarch: arm64 }
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: vrok-relay
    main: ./cmd/vrok-relay
    binary: vrok-relay
    env: [CGO_ENABLED=0]
    flags: [-trimpath, -buildvcs=false]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.date={{ .CommitDate }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  # The CLI, on its own. Most people installing vrok never run a relay, and
  # bundling the server would add megabytes they have no use for.
  - id: cli
    ids: [vrok]
    # Matches what install.sh expects: vrok_v0.1.0_darwin_arm64.tar.gz
    name_template: "vrok_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - docs/*
      - completions/*

  # The relay, for people running their own. Most will use the container
  # image instead.
  - id: relay
    ids: [vrok-relay]
    name_template: "vrok-relay_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - docs/protocol.md
      - docs/architecture.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# A software bill of materials per archive, so anyone auditing a release can
# see every module that went into it without building it themselves. Syft is
# installed by the release workflow.
sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Security
      regexp: '^.*?sec(urity)?(\(.+\))??!?:.+$'
      order: 2
    - title: Other
      order: 99
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      # Website changes ship through pages.yml, not in a CLI release.
      - '^[a-z]+\(site\)!?:'
      - Merge pull request

# brew install --cask AliJabbar034/tap/vrok
#
# Publishing to a tap, a bucket or winget needs repositories that do not exist
# until you create them, plus a TAP_GITHUB_TOKEN secret that can write to them.
# Until that secret is set these are skipped, so the first release of a fresh
# repository succeeds instead of failing on a missing tap.
#
# To enable Homebrew and Scoop: create AliJabbar034/homebrew-tap and
# AliJabbar034/scoop-bucket, then add a TAP_GITHUB_TOKEN secret that can write
# to both. winget is separate: fork microsoft/winget-pkgs and add a
# WINGET_GITHUB_TOKEN secret that can write to the fork.
#
# A cask rather than a formula: Homebrew now expects prebuilt binaries to ship
# as casks, and formulae for them are deprecated.
homebrew_casks:
  - name: vrok
    ids: [cli]
    skip_upload: '{{ if eq (envOrDefault "TAP_GITHUB_TOKEN" "") "" }}true{{ else }}false{{ end }}'
    repository:
      owner: AliJabbar034
      name: homebrew-tap
      # .Env, not envOrDefault: token fields are rendered without that
      # function, and the release fails with "function not defined".
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/AliJabbar034/vrok
    description: Share local files, folders and development servers through temporary URLs
    license: MIT
    commit_author:
      name: vrok-bot
      email: AliJabbar034@users.noreply.github.com
    # Only the CLI goes on PATH. vrok-relay is a server, and is still in the
    # archive for anyone who wants it.
    binaries: [vrok]
    completions:
      zsh: completions/vrok.zsh
      bash: completions/vrok.bash
      fish: completions/vrok.fish
    # Homebrew downloads over HTTPS, but Gatekeeper still quarantines an
    # unsigned binary; clearing the flag avoids a "cannot be opened" dialog on
    # first run. Written by hand because GoReleaser still emits the legacy
    # `postflight do` block, which Homebrew now warns about on every install.
    # A steps block may only hold literal arguments, so the path uses the
    # {{staged_path}} token, which Homebrew expands at install time.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr",
              args:         ["-dr", "com.apple.quarantine", "{{ "{{" }}staged_path{{ "}}" }}/vrok"],
              must_succeed: false
        end
      end

# scoop install vrok
scoops:
  - name: vrok
    ids: [cli]
    skip_upload: '{{ if eq (envOrDefault "TAP_GITHUB_TOKEN" "") "" }}true{{ else }}false{{ end }}'
    repository:
      owner: AliJabbar034
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/AliJabbar034/vrok
    description: Share local files, folders and development servers through temporary URLs
    license: MIT
    commit_author:
      name: vrok-bot
      email: AliJabbar034@users.noreply.github.com

# winget install AliJabbar034.vrok
winget:
  - name: vrok
    publisher: AliJabbar034
    ids: [cli]
    # Its own token: winget publishes through a fork of microsoft/winget-pkgs,
    # which the tap token is not scoped to. Without this secret the step is
    # skipped instead of failing the release.
    skip_upload: '{{ if eq (envOrDefault "WINGET_GITHUB_TOKEN" "") "" }}true{{ else }}false{{ end }}'
    license: MIT
    homepage: https://github.com/AliJabbar034/vrok
    short_description: Share local files, folders and development servers through temporary URLs
    description: |
      vrok exposes local files, directories and development servers through
      temporary URLs. Nothing is uploaded and nothing is stored: requests are
      served from your machine while the command runs, and the URL stops
      working when the share expires or you stop it.
    publisher_support_url: https://github.com/AliJabbar034/vrok/issues
    package_identifier: AliJabbar034.vrok
    repository:
      owner: AliJabbar034
      name: winget-pkgs
      branch: "vrok-{{ .Version }}"
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

# apt / dnf / apk packages, for servers and CI images
nfpms:
  - id: packages
    # The CLI only, to match the archives and the cask. The relay is deployed
    # as a container or from its own archive.
    ids: [vrok]
    package_name: vrok
    vendor: vrok
    homepage: https://github.com/AliJabbar034/vrok
    maintainer: Ali Jabbar <AliJabbar034@users.noreply.github.com>
    description: Share local files, folders and development servers through temporary URLs
    license: MIT
    formats: [deb, rpm, apk, archlinux]
    bindir: /usr/bin
    contents:
      - src: ./LICENSE
        dst: /usr/share/doc/vrok/LICENSE
      - src: ./README.md
        dst: /usr/share/doc/vrok/README.md
      - src: ./docs
        dst: /usr/share/doc/vrok/docs
      # Completions go where each shell looks for them, so tab completion
      # works straight after apt or dnf install.
      - src: ./completions/vrok.bash
        dst: /usr/share/bash-completion/completions/vrok
      - src: ./completions/vrok.zsh
        dst: /usr/share/zsh/site-functions/_vrok
      - src: ./completions/vrok.fish
        dst: /usr/share/fish/vendor_completions.d/vrok.fish
    # cloudflared is fetched on demand; it must not be a package dependency.
    recommends: [ca-certificates]

# The relay image. The CLI is intentionally not containerised: it serves files
# from the machine it runs on, which a container only gets in the way of.
#
# dockers_v2 builds both architectures and publishes one multi-platform
# manifest, so there is no separate manifest section to keep in sync.
dockers_v2:
  - id: relay
    ids: [vrok-relay]
    dockerfile: Dockerfile.release
    images:
      - ghcr.io/alijabbar034/vrok-relay
    tags:
      - "{{ .Version }}"
      - latest
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.title: vrok-relay
      # Shown on the GitHub package page, where people arrive looking for
      # vrok itself: say up front that this is not the CLI.
      org.opencontainers.image.description: "Self-hosted relay for vrok. To share files, install the vrok CLI instead: https://alijabbar034.github.io/vrok/download.html"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: https://github.com/AliJabbar034/vrok
      org.opencontainers.image.licenses: MIT

release:
  github:
    owner: AliJabbar034
    name: vrok
  # Re-running a release that failed halfway (release.yml's manual trigger)
  # must replace the files it already uploaded instead of failing on them.
  mode: keep-existing
  replace_existing_artifacts: true
  footer: |
    ## Install

    ```sh
    # macOS and Linux
    curl -fsSL https://raw.githubusercontent.com/AliJabbar034/vrok/main/install.sh | sh

    # Windows
    irm https://raw.githubusercontent.com/AliJabbar034/vrok/main/install.ps1 | iex

    # Homebrew
    brew install --cask AliJabbar034/tap/vrok

    # Scoop
    scoop bucket add vrok https://github.com/AliJabbar034/scoop-bucket
    scoop install vrok
    ```

    Verify a download against `checksums.txt`:

    ```sh
    shasum -a 256 -c checksums.txt --ignore-missing
    ```

    Prove it was built by this repository's release workflow, from this tag:

    ```sh
    gh attestation verify vrok_*.tar.gz --repo AliJabbar034/vrok
    ```

    Each archive also ships an SPDX software bill of materials (`*.sbom.json`).
