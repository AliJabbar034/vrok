name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The hooks can be skipped with --no-verify, and a web edit never runs them
  # at all, so the same rules are enforced here as well.
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            echo "run: make fmt"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: prettier
        run: |
          npx prettier --check . || {
            echo "formatting is off; run 'make fmt' and commit the result"
            exit 1
          }

      - name: Branch name
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -eu
          . ./.githooks/lib.sh
          if printf '%s' "$BRANCH" | grep -qE "$BRANCH_RE"; then
            echo "ok: $BRANCH"
          else
            echo "::warning::branch '$BRANCH' is not type/short-description (e.g. fix/range-requests)"
          fi

  check:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # vrok touches the filesystem, Unix sockets and the network, all of
        # which behave differently per platform, so all three are tested.
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          check-latest: true

      - name: Check formatting
        if: runner.os != 'Windows'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -count=1 ./...

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      # The download limit, the share registry and the relay's stream
      # multiplexing are all concurrent, so this job is not optional.
      - run: go test -race -count=1 ./...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - run: go test -coverprofile=coverage.out -covermode=atomic ./...
      - run: go tool cover -func=coverage.out | tail -1

  # Most contributors develop on one OS. This catches a Unix-only assumption
  # on the pull request rather than at release time.
  cross:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - run: make cross

  # The installers and the release config are the path users take, so a change
  # that breaks them should fail here and not on a tag.
  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable

      - name: Lint the installer
        run: shellcheck -s sh install.sh

      - name: Lint the PowerShell installer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path ./install.ps1 -Severity Error,Warning
          $issues | Format-Table -AutoSize
          if ($issues | Where-Object Severity -eq 'Error') { exit 1 }

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          args: check

      # The snapshot builds SBOMs the same way a real release does.
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      # A snapshot exercises the archives, packages and manifests without
      # needing a tag or any credentials.
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=docker,publish

      - name: Install from the snapshot archives
        run: |
          version=$(ls dist/vrok_*_linux_amd64.tar.gz | sed -E 's/.*vrok_(.*)_linux_amd64.tar.gz/\1/')
          (cd dist && python3 -m http.server 9000 >/dev/null 2>&1 &)
          sleep 2
          VROK_VERSION="$version" \
          VROK_DOWNLOAD_BASE=http://127.0.0.1:9000 \
          VROK_INSTALL_DIR="$HOME/.vrok-ci" \
            sh ./install.sh
          "$HOME/.vrok-ci/vrok" --version

      - name: Refuse a tampered archive
        run: |
          version=$(ls dist/vrok_*_linux_amd64.tar.gz | sed -E 's/.*vrok_(.*)_linux_amd64.tar.gz/\1/')
          mkdir -p bad && cp dist/vrok_*_linux_amd64.tar.gz dist/checksums.txt bad/
          printf 'tampered' >> "bad/vrok_${version}_linux_amd64.tar.gz"
          (cd bad && python3 -m http.server 9001 >/dev/null 2>&1 &)
          sleep 2
          if VROK_VERSION="$version" \
             VROK_DOWNLOAD_BASE=http://127.0.0.1:9001 \
             VROK_INSTALL_DIR="$HOME/.vrok-bad" \
               sh ./install.sh; then
            echo "installer accepted a tampered archive"; exit 1
          fi
          echo "installer correctly refused the tampered archive"

  relay-image:
    name: Relay image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t vrok-relay:ci .
      # The image is scratch-based, so a missing static link would only show
      # up when it is actually run.
      - name: Smoke test the image
        run: docker run --rm vrok-relay:ci -version
