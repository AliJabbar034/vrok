name: vulnerabilities

# govulncheck reports known vulnerabilities in the Go standard library and in
# dependencies, and only those the code actually reaches. It also runs weekly:
# a new advisory can land against code that has not changed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - run: govulncheck ./...
