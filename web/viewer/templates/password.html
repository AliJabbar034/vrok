{{define "content"}}
<section class="gate">
  <form class="gate__form" method="POST" action="{{.ActionURL}}" autocomplete="off">
    <span class="gate__icon">🔒</span>
    <h1 class="gate__title">Password required</h1>
    <p class="gate__hint">This share is protected. Ask the person who sent you the link.</p>

    {{if .Error}}<p class="gate__error" role="alert">{{.Error}}</p>{{end}}

    <label class="gate__label" for="password">Password</label>
    <input class="gate__input" id="password" name="password" type="password"
           autocomplete="current-password" autofocus required>
    <button class="button button--wide" type="submit">Unlock</button>
  </form>
</section>
{{end}}
